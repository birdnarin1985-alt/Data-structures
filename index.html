<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAM DATA LAB - Stack & Queue Algorithmic Engine</title>
  <style>
    :root {
      --bg: #030712;
      --panel: #0d1526;
      --panel-border: #1e293b;
      --text: #f8fafc;
      --muted: #64748b;
      --theme: #8b5cf6; /* สีม่วงเทคโนสำหรับ Stack & Queue */
      --phi: 1.618;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 21, 38, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge-uni {
      font-size: 9.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: 900;
      letter-spacing: 0.8px;
      font-family: monospace;
    }
    
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .switch-btn {
      height: 44px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      padding: 4px;
    }
    .switch-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(139, 92, 246, 0.15);
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    }

    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(139, 92, 246, 0.08);
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }

    .math-hud-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .formula-card {
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--theme);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 9px;
      font-family: "Courier New", Courier, monospace;
    }
    .formula-title {
      font-size: 7px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .formula-eq {
      color: #fff;
      font-weight: bold;
      font-size: 9px;
    }
    .formula-eq span.hl {
      color: var(--theme);
      font-weight: 900;
    }

    .control-box {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .control-info span.val {
      color: var(--theme);
      font-weight: bold;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: #030712;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--theme);
      box-shadow: 0 0 10px var(--theme);
      cursor: pointer;
      margin-top: -7px;
      border: 2px solid #fff;
    }

    .pedagogy-banner {
      background: rgba(139, 92, 246, 0.05);
      border: 1px dashed rgba(139, 92, 246, 0.35);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 10.5px;
      color: #ddd6fe;
      font-family: monospace;
      line-height: 1.4;
    }
    .pedagogy-banner strong {
      color: var(--theme);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="badge-uni">SIAM DATA LAB</span>
      <strong style="font-size: 11.5px;">Algorithmic Engine</strong>
    </div>
    <button class="lang-toggle-btn" onclick="toggleLanguage()">🌐 TH | EN</button>
  </header>

  <div class="app-container">
    
    <div class="model-switch">
      <button class="switch-btn active" id="btnStack" onclick="switchMode('stack')">📚 STACK (LIFO Algorithm)</button>
      <button class="switch-btn" id="btnQueue" onclick="switchMode('queue')">🚶‍♂️ QUEUE (FIFO Algorithm)</button>
    </div>

    <!-- Viewport ทองคำ 1:1.618 -->
    <div class="cad-viewport">
      <div class="math-hud-overlay">
        <div class="formula-card">
          <div class="formula-title" id="hudTitle">Algorithm Execution Trace</div>
          <div class="formula-eq">State: <span class="hl" id="progressVal">0%</span></div>
        </div>
      </div>
      <svg id="cadStage" viewBox="0 0 600 370">
        <defs>
          <marker id="arrow-stack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/>
          </marker>
        </defs>
        <g id="stageContent"></g>
      </svg>
    </div>

    <!-- แผงควบคุมสไลด์อัลกอริทึม -->
    <div class="control-box">
      <div class="control-info">
        <span id="scrubberLabel">1. กรอขั้นตอนอัลกอริทึม (Algorithm Scrubber)</span>
        <span class="val" id="scrubberPercent">0%</span>
      </div>
      <input type="range" id="timeSlider" min="0" max="100" value="0" oninput="onScrub(this.value)">

      <div class="control-info" style="margin-top: 6px;">
        <span id="lengthLabel">2. ขนาดข้อมูลตั้งต้น (Capacity N)</span>
        <span class="val" id="lengthVal">4 Items</span>
      </div>
      <input type="range" id="lengthSlider" min="3" max="6" value="4" oninput="onLengthChange(this.value)">
    </div>

    <div class="pedagogy-banner" id="bannerText">
      <strong>วิชาชั้นครู:</strong> ใช้แถบสไลด์เพื่อจำลองการทำงานของฟังก์ชัน Push/Pop (Stack) และ Enqueue/Dequeue (Queue) ตามกฎเกณฑ์อัลกอริทึมอย่างเคร่งครัด
    </div>

  </div>

  <script>
    let mode = 'stack';
    let lang = 'th';
    let progress = 0;
    let capacity = 4;

    function toggleLanguage() {
      lang = (lang === 'th') ? 'en' : 'th';
      document.querySelector('.lang-toggle-btn').innerText = lang === 'th' ? '🌐 TH | EN' : '🌐 EN | TH';
      if (lang === 'th') {
        document.getElementById('btnStack').innerText = "📚 STACK (LIFO Algorithm)";
        document.getElementById('btnQueue').innerText = "🚶‍♂️ QUEUE (FIFO Algorithm)";
        document.getElementById('scrubberLabel').innerText = "1. กรอขั้นตอนอัลกอริทึม (Algorithm Scrubber)";
        document.getElementById('lengthLabel').innerText = "2. ขนาดข้อมูลตั้งต้น (Capacity N)";
        document.getElementById('bannerText').innerHTML = "<strong>วิชาชั้นครู:</strong> ใช้แถบสไลด์เพื่อจำลองการทำงานของฟังก์ชัน Push/Pop (Stack) และ Enqueue/Dequeue (Queue) ตามกฎเกณฑ์อัลกอริทึมอย่างเคร่งครัด";
      } else {
        document.getElementById('btnStack').innerText = "📚 STACK (LIFO Algorithm)";
        document.getElementById('btnQueue').innerText = "🚶‍♂️ QUEUE (FIFO Algorithm)";
        document.getElementById('scrubberLabel').innerText = "1. Algorithm Scrubber Timeline";
        document.getElementById('lengthLabel').innerText = "2. Capacity (N Elements)";
        document.getElementById('bannerText').innerHTML = "<strong>Masterclass:</strong> Scrub through the timeline to trace exact Push/Pop and Enqueue/Dequeue algorithmic state transitions.";
      }
      renderStage();
    }

    function switchMode(m) {
      mode = m;
      progress = 0;
      document.getElementById('timeSlider').value = 0;
      document.getElementById('btnStack').classList.toggle('active', m === 'stack');
      document.getElementById('btnQueue').classList.toggle('active', m === 'queue');
      renderStage();
    }

    function onScrub(val) {
      progress = parseFloat(val);
      document.getElementById('progressVal').innerText = `${Math.round(progress)}%`;
      document.getElementById('scrubberPercent').innerText = `${Math.round(progress)}%`;
      renderStage();
    }

    function onLengthChange(val) {
      capacity = parseInt(val);
      document.getElementById('lengthVal').innerText = `${capacity} Items`;
      renderStage();
    }

    function renderStage() {
      const container = document.getElementById('stageContent');
      let svg = '';
      const p = progress / 100;

      if (mode === 'stack') {
        svg += `<text x="300" y="35" fill="#8b5cf6" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">STACK: LIFO ALGORITHM TRACE (PUSH / POP O(1))</text>`;
        
        // โครงสร้างกล่อง Stack ในแนวตั้ง (LIFO)
        const boxW = 140;
        const boxH = 40;
        const startX = (600 - boxW) / 2;
        const bottomY = 310;

        // วาดกรอบโครงสร้าง Stack Container
        let totalContainerH = capacity * boxH + 20;
        svg += `<rect x="${startX - 10}" y="${bottomY - totalContainerH}" width="${boxW + 20}" height="${totalContainerH}" rx="6" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4"/>`;
        svg += `<text x="${startX + boxW/2}" y="${bottomY - totalContainerH - 8}" fill="#8b5cf6" font-size="8.5" font-family="monospace" text-anchor="middle">TOP OF STACK (SP)</text>`;

        // อัลกอริทึมสถานะ Stack ตาม p (0% -> 100%)
        // p: 0.0 -> 0.5 ( Push ข้อมูลเข้าทีละชั้น )
        // p: 0.5 -> 1.0 ( Pop ข้อมูลออกทีละชั้นจากบนสุด )
        let activeCount = 0;
        let incomingOpacity = 0;
        let incomingY = 0;

        if (p <= 0.5) {
          let pushProgress = p / 0.5; // 0 ถึง 1
          activeCount = Math.floor(pushProgress * capacity);
          let remainder = (pushProgress * capacity) % 1;
          if (activeCount < capacity && remainder > 0.01) {
            incomingOpacity = remainder;
            incomingY = bottomY - ((activeCount + 1) * boxH) - (1.0 - remainder) * 40;
          }
          if (activeCount > capacity) activeCount = capacity;
        } else {
          let popProgress = (p - 0.5) / 0.5; // 0 ถึง 1
          activeCount = capacity - Math.floor(popProgress * capacity);
          if (activeCount < 0) activeCount = 0;
        }

        // วาดบล็อกข้อมูลภายใน Stack
        for (let i = 0; i < activeCount; i++) {
          let by = bottomY - ((i + 1) * boxH);
          let val = (i + 1) * 15;
          svg += `
            <g transform="translate(${startX}, ${by})">
              <rect width="${boxW}" height="${boxH - 4}" rx="4" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="2"/>
              <text x="${boxW/2}" y="${boxH/2 - 2}" fill="#fff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">Stack[${i}] = ${val}</text>
            </g>
          `;
        }

        // แสดงแอนิเมชันกำลัง Push ข้อมูลเข้ามาใหม่
        if (incomingOpacity > 0.01 && p <= 0.5) {
          let nextVal = (activeCount + 1) * 15;
          svg += `
            <g transform="translate(${startX}, ${incomingY})" opacity="${incomingOpacity}">
              <rect width="${boxW}" height="${boxH - 4}" rx="4" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="2"/>
              <text x="${boxW/2}" y="${boxH/2 - 2}" fill="#fff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">PUSH(${nextVal})</text>
            </g>
          `;
        }

      } else {
        svg += `<text x="300" y="35" fill="#10b981" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">QUEUE: FIFO ALGORITHM TRACE (ENQUEUE / DEQUEUE O(1))</text>";`;
        
        // โครงสร้างกล่อง Queue ในแนวนอน (FIFO)
        const boxW = 65;
        const boxH = 50;
        const totalSpan = capacity * (boxW + 8);
        const startX = (600 - totalSpan) / 2;
        const cy = 210;

        // วาดกรอบโครงสร้าง Queue Pipeline
        svg += `<rect x="${startX - 10}" y="${cy - boxH/2 - 10}" width="${totalSpan + 12}" height="${boxH + 20}" rx="6" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>`;
        svg += `<text x="${startX}" y="${cy - boxH/2 - 15}" fill="#10b981" font-size="8.5" font-family="monospace">HEAD (Dequeue)</text>`;
        svg += `<text x="${startX + totalSpan - 30}" y="${cy - boxH/2 - 15}" fill="#f59e0b" font-size="8.5" font-family="monospace">TAIL (Enqueue)</text>`;

        // อัลกอริทึมสถานะ Queue ตาม p (0% -> 100%)
        // p: 0.0 -> 0.5 ( Enqueue เข้าท้ายแถวทีละตัว )
        // p: 0.5 -> 1.0 ( Dequeue ออกจากหัวแถวทีละตัว )
        let activeCount = 0;

        if (p <= 0.5) {
          let enqProgress = p / 0.5;
          activeCount = Math.floor(enqProgress * capacity);
          if (activeCount > capacity) activeCount = capacity;
        } else {
          let deqProgress = (p - 0.5) / 0.5;
          activeCount = capacity - Math.floor(deqProgress * capacity);
          if (activeCount < 0) activeCount = 0;
        }

        for (let i = 0; i < activeCount; i++) {
          let bx = startX + (i * (boxW + 8));
          let val = (i + 1) * 10;
          let isHead = (i === 0);
          let col = isHead ? "#f59e0b" : "#10b981";

          svg += `
            <g transform="translate(${bx}, ${cy - boxH/2})">
              <rect width="${boxW}" height="${boxH}" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="${col}" stroke-width="1.8"/>
              <text x="${boxW/2}" y="${boxH*0.4}" fill="${col}" font-size="8" font-family="monospace" text-anchor="middle">${isHead ? 'HEAD' : `Q[${i}]`}</text>
              <text x="${boxW/2}" y="${boxH*0.75}" fill="#fff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">${val}</text>
            </g>
          `;
        }
      }

      container.innerHTML = svg;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderStage();
    });
  </script>
</body>
</html>
