<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAM DATA LAB - Hanoi Style Array & Linked List Simulator</title>
  <style>
    :root {
      --bg: #030712;
      --panel: #0d1526;
      --panel-border: #1e293b;
      --text: #f8fafc;
      --muted: #64748b;
      --theme: #3b82f6;
      --phi: 1.618;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 21, 38, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge-uni {
      font-size: 9.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: 900;
      font-family: monospace;
    }
    
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* สลับโหมด Array / Linked List */
    .model-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .switch-btn {
      height: 44px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 10px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
    }
    .switch-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(59, 130, 246, 0.08);
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }

    .math-hud-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .formula-card {
      background: rgba(3, 7, 18, 0.88);
      border: 1px solid var(--panel-border);
      border-left: 2px solid var(--theme);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 9px;
      font-family: "Courier New", Courier, monospace;
    }
    .formula-title {
      font-size: 7.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .formula-eq {
      color: #fff;
      font-weight: bold;
    }
    .formula-eq span.hl {
      color: var(--theme);
      font-weight: 900;
    }

    .tool-btn {
      background: rgba(13, 21, 38, 0.85);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 9.5px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
    }

    .pedagogy-banner {
      background: rgba(59, 130, 246, 0.05);
      border: 1px dashed rgba(59, 130, 246, 0.35);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 10px;
      color: #bfdbfe;
      font-family: monospace;
      line-height: 1.4;
    }
    .pedagogy-banner strong {
      color: var(--theme);
    }

    .control-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="badge-uni">SIAM DATA LAB</span>
      <strong style="font-size: 11px;">Hanoi-Style Structure Engine</strong>
    </div>
    <button class="lang-toggle-btn" onclick="toggleLanguage()">🌐 TH | EN</button>
  </header>

  <div class="app-container">
    
    <div class="model-switch">
      <button class="switch-btn active" id="btnArr" onclick="switchMode('array')">📦 ARRAY (ล็อกช่องตายตัว)</button>
      <button class="switch-btn" id="btnList" onclick="switchMode('list')">🔗 LINKED LIST (อิสระ + พอยเตอร์)</button>
    </div>

    <div class="cad-viewport">
      <div class="math-hud-overlay">
        <div class="formula-card">
          <div class="formula-title" id="hudTitle">โหมดจำลองการแทรกข้อมูล</div>
          <div class="formula-eq" id="hudDesc">คลิกปุ่มเพื่อดูแอนิเมชัน <span class="hl">Tower Shift</span></div>
        </div>
        <div class="viewport-tools">
          <button class="tool-btn" onclick="triggerAnimation()">⚡ แทรกข้อมูล (Insert)</button>
        </div>
      </div>
      <svg id="cadStage" viewBox="0 0 600 370"></svg>
    </div>

    <div class="pedagogy-banner" id="bannerText">
      <strong>กิมมิคฮานอย:</strong> สังเกตการขยับเลื่อนของแผ่นดิสก์ เมื่อต้องการแทรกข้อมูลตรงกลางโครงสร้าง
    </div>

    <div class="control-panel">
      <div style="font-size: 11px; color: var(--muted); font-family: monospace;" id="statusText">
        สถานะ: พร้อมจำลองแอนิเมชันการไหลของข้อมูล
      </div>
    </div>

  </div>

  <script>
    let mode = 'array';
    let lang = 'th';
    let animStep = 0;

    function toggleLanguage() {
      lang = (lang === 'th') ? 'en' : 'th';
      document.querySelector('.lang-toggle-btn').innerText = lang === 'th' ? '🌐 TH | EN' : '🌐 EN | TH';
      if (lang === 'th') {
        document.getElementById('btnArr').innerText = "📦 ARRAY (ล็อกช่องตายตัว)";
        document.getElementById('btnList').innerText = "🔗 LINKED LIST (อิสระ + พอยเตอร์)";
        document.getElementById('hudTitle').innerText = "โหมดจำลองการแทรกข้อมูล";
        document.getElementById('bannerText').innerHTML = "<strong>กิมมิคฮานอย:</strong> สังเกตการขยับเลื่อนของแผ่นดิสก์ เมื่อต้องการแทรกข้อมูลตรงกลางโครงสร้าง";
      } else {
        document.getElementById('btnArr').innerText = "📦 ARRAY (Contiguous Slots)";
        document.getElementById('btnList').innerText = "🔗 LINKED LIST (Pointer Nodes)";
        document.getElementById('hudTitle').innerText = "Insertion Simulation Mode";
        document.getElementById('bannerText').innerHTML = "<strong>Hanoi Gimmick:</strong> Observe disc shifting behavior when inserting an element in the middle.";
      }
      renderStage();
    }

    function switchMode(m) {
      mode = m;
      animStep = 0;
      document.getElementById('btnArr').classList.toggle('active', m === 'array');
      document.getElementById('btnList').classList.toggle('active', m === 'list');
      renderStage();
    }

    function triggerAnimation() {
      animStep = (animStep + 1) % 3;
      renderStage();
    }

    function renderStage() {
      const stage = document.getElementById('cadStage');
      const cy = 200;
      let svg = '';

      if (mode === 'array') {
        // แอนิเมชัน Array แบบตึกแผ่นดิสก์ฮานอยสไลด์ขยับ
        svg = `
          <text x="300" y="55" fill="#3b82f6" font-size="10.5" font-weight="bold" font-family="monospace" text-anchor="middle">ARRAY: CONTIGUOUS SHIFT (STEP ${animStep}/2)</text>
        `;
        const discs = [
          { val: 10, label: "v[0]", x: 140 },
          { val: 20, label: "v[1]", x: 220 },
          { val: animStep > 0 ? 99 : 30, label: animStep > 0 ? "NEW" : "v[2]", x: animStep > 0 ? 300 : 300 },
          { val: 30, label: "v[3]", x: animStep > 0 ? 380 : 380 },
          { val: 40, label: "v[4]", x: animStep > 0 ? 460 : 460 }
        ];

        // ถ้า animStep == 2 ให้แผ่นดิสก์ขยับหลบ (Shift O(N))
        if (animStep === 2) {
          discs[3].x = 380 + 40; // ขยับขวา
          discs[4].x = 460 + 40; // ขยับขวา
        }

        discs.forEach((d, idx) => {
          const isNew = d.label === "NEW";
          const col = isNew ? "#10b981" : "#3b82f6";
          svg += `
            <rect x="${d.x}" y="${cy-40}" width="70" height="70" rx="6" fill="${isNew?'rgba(16, 185, 129, 0.2)':'rgba(59, 130, 246, 0.12)'}" stroke="${col}" stroke-width="2"/>
            <text x="${d.x + 35}" y="${cy - 10}" fill="${col}" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">${d.label}</text>
            <text x="${d.x + 35}" y="${cy + 15}" fill="#fff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">Data: ${d.val}</text>
          `;
        });

      } else {
        // แอนิเมชัน Linked List แบบห่วงโซ่ฮานอย พอยเตอร์หักเหอิสระ
        svg = `
          <text x="300" y="55" fill="#10b981" font-size="10.5" font-weight="bold" font-family="monospace" text-anchor="middle">LINKED LIST: POINTER RE-ROUTING (STEP ${animStep}/2)</text>
        `;
        const nodes = [
          { label: "Head", val: "10", x: 100, y: cy },
          { label: "Node 1", val: "20", x: 260, y: cy + (animStep > 0 ? -40 : 0) },
          { label: "New Node", val: "99", x: 260, y: cy + 60, show: animStep > 0 },
          { label: "Node 2", val: "30", x: 420, y: cy }
        ];

        // วาดเส้นพอยเตอร์เชื่อมโยง
        if (animStep === 0) {
          svg += `<line x1="170" y1="${cy}" x2="260" y2="${cy}" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>`;
          svg += `<line x1="330" y1="${cy}" x2="420" y2="${cy}" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>`;
        } else {
          // พอยเตอร์เปลี่ยนทิศทางทันทีโดยไม่ต้องขยับ Node อื่น
          svg += `<line x1="170" y1="${cy}" x2="260" y2="${cy-40}" stroke="#f59e0b" stroke-width="2.5"/>`;
          svg += `<line x1="330" y1="${cy-40}" x2="350" y2="${cy+60}" stroke="#10b981" stroke-width="2.5"/>`;
          svg += `<line x1="330" y1="${cy+60}" x2="420" y2="${cy}" stroke="#10b981" stroke-width="2.5"/>`;
        }

        nodes.forEach((n) => {
          if (n.label === "New Node" && !n.show) return;
          const col = n.label === "New Node" ? "#10b981" : "#3b82f6";
          svg += `
            <rect x="${n.x}" y="${n.y - 25}" width="70" height="50" rx="6" fill="rgba(13, 21, 38, 0.9)" stroke="${col}" stroke-width="2"/>
            <text x="${n.x + 35}" y="${n.y - 8}" fill="${col}" font-size="8.5" font-family="monospace" text-anchor="middle">${n.label}</text>
            <text x="${n.x + 35}" y="${n.y + 12}" fill="#fff" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">[${n.val}|•]</text>
          `;
        });
      }

      stage.innerHTML = svg;
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderStage();
    });
  </script>
</body>
</html>
