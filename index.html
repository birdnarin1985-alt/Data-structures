<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAM DATA LAB - CAD Radial Menu Engine</title>
  <style>
    :root {
      --bg: #030712;
      --panel: #0d1526;
      --panel-border: #1e293b;
      --text: #f8fafc;
      --muted: #64748b;
      --theme: #10b981;
      --radius: 8px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 21, 38, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge-uni {
      font-size: 9.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: 900;
      letter-spacing: 0.8px;
      font-family: monospace;
    }
    
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(16, 185, 129, 0.08);
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }

    .math-hud-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: flex-start;
      pointer-events: none;
      z-index: 5;
    }
    .formula-card {
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--theme);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 9px;
      font-family: "Courier New", Courier, monospace;
    }
    .formula-title {
      font-size: 7px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .formula-eq {
      color: #fff;
      font-weight: bold;
      font-size: 9px;
    }
    .formula-eq span.hl {
      color: var(--theme);
      font-weight: 900;
    }

    /* Contextual Radial / Floating Menu สไตล์ CAD */
    .radial-menu {
      position: absolute;
      width: 140px;
      height: 140px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 20;
      display: none;
    }
    .radial-menu.active {
      pointer-events: auto;
      display: block;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .radial-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: rgba(13, 21, 38, 0.95);
      border: 1.5px solid var(--theme);
      color: #fff;
      border-radius: 50%;
      font-size: 9px;
      font-weight: bold;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
      transition: 0.2s;
    }
    .radial-btn:hover {
      background: var(--theme);
      color: #030712;
      transform: scale(1.1);
    }
    /* ตำแหน่งปุ่มรอบวงกลม */
    .rb-top { top: 0; left: 48px; }
    .rb-left { top: 48px; left: 0; }
    .rb-right { top: 48px; right: 0; }
    .rb-bottom { bottom: 0; left: 48px; }

    .control-box {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
    }
    .control-info span.val {
      color: var(--theme);
      font-weight: bold;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 24px;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      background: #030712;
      border: 1px solid var(--panel-border);
      border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--theme);
      box-shadow: 0 0 10px var(--theme);
      cursor: pointer;
      margin-top: -7px;
      border: 2px solid #fff;
    }

    .pedagogy-banner {
      background: rgba(16, 185, 129, 0.05);
      border: 1px dashed rgba(16, 185, 129, 0.35);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 10.5px;
      color: #a7f3d0;
      font-family: monospace;
      line-height: 1.4;
    }
    .pedagogy-banner strong {
      color: var(--theme);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="badge-uni">SIAM DATA LAB</span>
      <strong style="font-size: 11.5px;">CAD Radial Menu Engine</strong>
    </div>
    <button class="lang-toggle-btn" onclick="toggleLanguage()">🌐 TH | EN</button>
  </header>

  <div class="app-container">
    
    <!-- Viewport ทองคำ พร้อม Radial Menu Overlay -->
    <div class="cad-viewport" id="viewport">
      <div class="math-hud-overlay">
        <div class="formula-card">
          <div class="formula-title" id="hudTitle">CAD Inspector</div>
          <div class="formula-eq">Selected: <span class="hl" id="selectedVal">None (Tap any Node)</span></div>
        </div>
      </div>

      <svg id="cadStage" viewBox="0 0 600 370" onclick="handleSvgBgClick(event)">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
          </marker>
        </defs>
        <g id="stageContent"></g>
      </svg>

      <!-- Contextual Radial Menu -->
      <div class="radial-menu" id="radialMenu">
        <div class="radial-btn rb-top" onclick="radialAction('insert')"><span>➕</span><span>Ins</span></div>
        <div class="radial-btn rb-left" onclick="radialAction('inspect')"><span>🔍</span><span>Info</span></div>
        <div class="radial-btn rb-right" onclick="radialAction('delete')"><span>🗑️</span><span>Del</span></div>
        <div class="radial-btn rb-bottom" onclick="radialAction('close')"><span>❌</span><span>Close</span></div>
      </div>
    </div>

    <!-- แผงควบคุมพารามิเตอร์ N -->
    <div class="control-box">
      <div class="control-info">
        <span id="lengthLabel">พารามิเตอร์จำนวนโหนด (Data Length N)</span>
        <span class="val" id="lengthVal">5 Nodes</span>
      </div>
      <input type="range" id="lengthSlider" min="3" max="7" value="5" oninput="onLengthChange(this.value)">
    </div>

    <div class="pedagogy-banner" id="bannerText">
      <strong>CAD Radial Menu:</strong> แตะคลิกที่โหนดใดก็ได้ใน Linked List เพื่อเปิดเมนูวงศาคณาญาติ (Radial Menu) สั่งการแทรก ลบ หรือตรวจสอบคุณสมบัติได้ทันที
    </div>

  </div>

  <script>
    let lang = 'th';
    let dataLength = 5;
    let selectedNodeIdx = null;
    let activeNodes = [10, 20, 30, 40, 50];

    function toggleLanguage() {
      lang = (lang === 'th') ? 'en' : 'th';
      document.querySelector('.lang-toggle-btn').innerText = lang === 'th' ? '🌐 TH | EN' : '🌐 EN | TH';
      if (lang === 'th') {
        document.getElementById('lengthLabel').innerText = "พารามิเตอร์จำนวนโหนด (Data Length N)";
        document.getElementById('bannerText').innerHTML = "<strong>CAD Radial Menu:</strong> แตะคลิกที่โหนดใดก็ได้ใน Linked List เพื่อเปิดเมนูวงศาคณาญาติ (Radial Menu) สั่งการแทรก ลบ หรือตรวจสอบคุณสมบัติได้ทันที";
      } else {
        document.getElementById('lengthLabel').innerText = "Data Length Parameter (N)";
        document.getElementById('bannerText').innerHTML = "<strong>CAD Radial Menu:</strong> Tap any node in the Linked List to trigger a contextual radial command menu.";
      }
      renderStage();
    }

    function onLengthChange(val) {
      dataLength = parseInt(val);
      activeNodes = [];
      for(let i=0; i<dataLength; i++) activeNodes.push((i+1)*10);
      document.getElementById('lengthVal').innerText = `${dataLength} Nodes`;
      closeRadialMenu();
      renderStage();
    }

    function createCyberCurveComponent(x1, y1, x2, y2) {
      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2 + 20;
      return `<path d="M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow)"/>`;
    }

    function renderStage() {
      const container = document.getElementById('stageContent');
      const cy = 210;
      let svg = '';

      const nodeW = Math.max(35, Math.min(58, (480 / activeNodes.length) - 8));
      const nodeH = nodeW * 0.65;
      const spacing = Math.max(14, Math.min(24, 110 / activeNodes.length));
      const totalNodeSpan = activeNodes.length * nodeW + (activeNodes.length - 1) * spacing;
      const nodeStartX = (600 - totalNodeSpan) / 2;

      svg += `<text x="300" y="35" fill="#10b981" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">CAD LINKED LIST ENGINE (TAP NODE TO OPEN RADIAL MENU)</text>`;

      for (let i = 0; i < activeNodes.length; i++) {
        let nx = nodeStartX + (i * (nodeW + spacing));
        let ny = cy;

        if (i < activeNodes.length - 1) {
          let nextNx = nodeStartX + ((i + 1) * (nodeW + spacing));
          svg += createCyberCurveComponent(nx + nodeW, ny, nextNx, ny);
        }

        let isSelected = (selectedNodeIdx === i);
        let strokeCol = isSelected ? "#f59e0b" : "#10b981";
        let fillCol = isSelected ? "rgba(245, 158, 11, 0.2)" : "rgba(16, 185, 129, 0.12)";

        // เก็บพิกัดกึ่งกลางโหนดสำหรับแปลงเป็นพิกเซลจอภาพตอนคลิก
        let screenCenterX = nx + nodeW/2;
        let screenCenterY = ny;

        svg += `
          <g transform="translate(${nx}, ${ny - nodeH/2})" style="cursor: pointer;" onclick="onNodeClick(event, ${i}, ${screenCenterX}, ${screenCenterY})">
            <rect width="${nodeW}" height="${nodeH}" rx="4" fill="${fillCol}" stroke="${strokeCol}" stroke-width="${isSelected ? '2.5' : '1.8'}"/>
            <text x="${nodeW/2}" y="${nodeH*0.38}" fill="${strokeCol}" font-size="${Math.max(6, nodeW*0.16)}" font-family="monospace" text-anchor="middle">N${i}</text>
            <text x="${nodeW/2}" y="${nodeH*0.78}" fill="#fff" font-size="${Math.max(7, nodeW*0.22)}" font-weight="bold" font-family="monospace" text-anchor="middle">[${activeNodes[i]}|•]</text>
          </g>
        `;
      }

      container.innerHTML = svg;
    }

    function onNodeClick(event, idx, svgX, svgY) {
      event.stopPropagation();
      selectedNodeIdx = idx;
      document.getElementById('selectedVal').innerText = `Node N${idx} (Val: ${activeNodes[idx]})`;
      renderStage();

      // แปลงพิกัด SVG (600x370) ให้เป็นตำแหน่งพิกเซลสัมพัทธ์ของ Viewport (%)
      const viewport = document.getElementById('viewport');
      const vW = viewport.clientWidth;
      const vH = viewport.clientHeight;

      const pxX = (svgX / 600) * vW;
      const pxY = (svgY / 370) * vH;

      const menu = document.getElementById('radialMenu');
      menu.style.left = `${pxX}px`;
      menu.style.top = `${pxY}px`;
      menu.classList.add('active');
    }

    function handleSvgBgClick(event) {
      // คลิกพื้นที่ว่างเพื่อปิด Radial Menu
      closeRadialMenu();
    }

    function closeRadialMenu() {
      selectedNodeIdx = null;
      document.getElementById('selectedVal').innerText = "None (Tap any Node)";
      document.getElementById('radialMenu').classList.remove('active');
      renderStage();
    }

    function radialAction(action) {
      if (selectedNodeIdx === null) return;

      if (action === 'insert') {
        // แทรกโหนดใหม่หลังโหนดที่เลือก
        let newVal = activeNodes[selectedNodeIdx] + 5;
        activeNodes.splice(selectedNodeIdx + 1, 0, newVal);
        dataLength = activeNodes.length;
        document.getElementById('lengthSlider').value = dataLength;
        document.getElementById('lengthVal').innerText = `${dataLength} Nodes`;
      } else if (action === 'delete') {
        // ลบโหนดที่เลือก
        if (activeNodes.length > 2) {
          activeNodes.splice(selectedNodeIdx, 1);
          dataLength = activeNodes.length;
          document.getElementById('lengthSlider').value = dataLength;
          document.getElementById('lengthVal').innerText = `${dataLength} Nodes`;
        }
      } else if (action === 'inspect') {
        alert(`Node Index: ${selectedNodeIdx}\nValue: ${activeNodes[selectedNodeIdx]}\nMemory Address: 0x0F${selectedNodeIdx}A`);
      }

      closeRadialMenu();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderStage();
    });
  </script>
</body>
</html>
