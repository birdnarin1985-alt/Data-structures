<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAM DATA LAB - Clean Golden Ratio Data Structures</title>
  <style>
    :root {
      --bg: #030712;
      --panel: #0d1526;
      --panel-border: #1e293b;
      --text: #f8fafc;
      --muted: #64748b;
      --theme: #3b82f6;
      --phi: 1.618;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 30px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(13, 21, 38, 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge-uni {
      font-size: 9.5px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--theme);
      color: var(--theme);
      font-weight: 900;
      font-family: monospace;
    }
    
    .lang-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--panel-border);
      color: var(--theme);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 900;
      font-family: monospace;
      cursor: pointer;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .switch-btn {
      height: 44px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 6px;
      font-size: 9.5px;
      font-weight: bold;
      font-family: monospace;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      padding: 4px;
    }
    .switch-btn.active {
      border-color: var(--theme);
      color: #fff;
      background: rgba(59, 130, 246, 0.15);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
    }

    .cad-viewport {
      width: 100%;
      aspect-ratio: 1.618 / 1;
      background: #020617;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(59, 130, 246, 0.08);
    }
    svg#cadStage {
      width: 100%;
      height: 100%;
      display: block;
    }

    .math-hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }
    .formula-card {
      background: rgba(3, 7, 18, 0.92);
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--theme);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 9.5px;
      font-family: "Courier New", Courier, monospace;
      max-width: 65%;
    }
    .formula-title {
      font-size: 7.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .formula-eq {
      color: #fff;
      font-weight: bold;
    }
    .formula-eq span.hl {
      color: var(--theme);
      font-weight: 900;
    }

    .tool-btn {
      background: rgba(13, 21, 38, 0.95);
      border: 1px solid var(--theme);
      color: var(--theme);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 10px;
      font-family: monospace;
      font-weight: bold;
      cursor: pointer;
      pointer-events: auto;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
    }
    .tool-btn:active {
      background: var(--theme);
      color: #000;
    }

    .pedagogy-banner {
      background: rgba(59, 130, 246, 0.05);
      border: 1px dashed rgba(59, 130, 246, 0.35);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 10.5px;
      color: #bfdbfe;
      font-family: monospace;
      line-height: 1.4;
    }
    .pedagogy-banner strong {
      color: var(--theme);
    }

    .control-panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="badge-uni">SIAM DATA LAB</span>
      <strong style="font-size: 11.5px;">Hanoi-Style Structure Engine</strong>
    </div>
    <button class="lang-toggle-btn" onclick="toggleLanguage()">🌐 TH | EN</button>
  </header>

  <div class="app-container">
    
    <div class="model-switch">
      <button class="switch-btn active" id="btnArr" onclick="switchMode('array')">📦 ARRAY (ล็อกช่องตายตัว)</button>
      <button class="switch-btn" id="btnList" onclick="switchMode('list')">🔗 LINKED LIST (อิสระ + พอยเตอร์)</button>
    </div>

    <div class="cad-viewport">
      <div class="math-hud-overlay">
        <div class="formula-card">
          <div class="formula-title" id="hudTitle">โหมดจำลองการแทรกข้อมูล</div>
          <div class="formula-eq" id="hudDesc">สถานะ: <span class="hl" id="stepLabel">สเตจที่ 0 / 2</span></div>
        </div>
        <div class="viewport-tools">
          <button class="tool-btn" onclick="triggerAnimation()">⚡ แทรกข้อมูล</button>
        </div>
      </div>
      <svg id="cadStage" viewBox="0 0 600 370"></svg>
    </div>

    <div class="pedagogy-banner" id="bannerText">
      <strong>กิมมิคฮานอย:</strong> สังเกตการขยับเลื่อนของบล็อกข้อมูล เมื่อต้องการแทรกข้อมูลตรงกลางโครงสร้าง Array
    </div>

    <div class="control-panel" id="statusText">
      คำอธิบาย: คลิกปุ่ม "แทรกข้อมูล" เพื่อดูการขยับย้ายหน่วยความจำ (Shift Cost O(N))
    </div>

  </div>

  <script>
    let mode = 'array';
    let lang = 'th';
    let animStep = 0;

    function toggleLanguage() {
      lang = (lang === 'th') ? 'en' : 'th';
      document.querySelector('.lang-toggle-btn').innerText = lang === 'th' ? '🌐 TH | EN' : '🌐 EN | TH';
      if (lang === 'th') {
        document.getElementById('btnArr').innerText = "📦 ARRAY (ล็อกช่องตายตัว)";
        document.getElementById('btnList').innerText = "🔗 LINKED LIST (อิสระ + พอยเตอร์)";
        document.getElementById('hudTitle').innerText = "โหมดจำลองการแทรกข้อมูล";
        document.getElementById('stepLabel').innerText = `สเตจที่ ${animStep} / 2`;
        document.querySelector('.tool-btn').innerText = "⚡ แทรกข้อมูล";
        document.getElementById('bannerText').innerHTML = "<strong>กิมมิคฮานอย:</strong> สังเกตการขยับเลื่อนของบล็อกข้อมูล เมื่อต้องการแทรกข้อมูลตรงกลางโครงสร้าง Array";
        document.getElementById('statusText').innerText = animStep === 0 ? "คำอธิบาย: ข้อมูลเรียงต่อกันปกติในหน่วยความจำ" : (animStep === 1 ? "คำอธิบาย: แทรกข้อมูลใหม่ตรงกลาง ช่องข้างหลังต้องขยับหนี" : "คำอธิบาย: ข้อมูลทั้งหมดถูก Shift สำเร็จ ใช้เวลา O(N)");
      } else {
        document.getElementById('btnArr').innerText = "📦 ARRAY (Contiguous Slots)";
        document.getElementById('btnList').innerText = "🔗 LINKED LIST (Pointer Nodes)";
        document.getElementById('hudTitle').innerText = "Insertion Simulation Mode";
        document.getElementById('stepLabel').innerText = `Stage ${animStep} / 2`;
        document.querySelector('.tool-btn').innerText = "⚡ Insert Data";
        document.getElementById('bannerText').innerHTML = "<strong>Hanoi Gimmick:</strong> Observe memory block shifting when inserting an element in the middle of an Array.";
        document.getElementById('statusText').innerText = animStep === 0 ? "Description: Normal contiguous memory layout." : (animStep === 1 ? "Description: Inserting in middle forces subsequent items to shift." : "Description: Shift complete. Cost is O(N).");
      }
      renderStage();
    }

    function switchMode(m) {
      mode = m;
      animStep = 0;
      document.getElementById('btnArr').classList.toggle('active', m === 'array');
      document.getElementById('btnList').classList.toggle('active', m === 'list');
      toggleLanguage();
    }

    function triggerAnimation() {
      animStep = (animStep + 1) % 3;
      toggleLanguage();
    }

    function renderStage() {
      const stage = document.getElementById('cadStage');
      const cy = 210;
      let svg = '';

      if (mode === 'array') {
        svg = `
          <text x="300" y="45" fill="#3b82f6" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">ARRAY: CONTIGUOUS MEMORY SHIFT (O(N))</text>
        `;
        const discs = [
          { label: "v[0]", val: 10, x: 75 },
          { label: "v[1]", val: 20, x: 160 },
          { label: animStep > 0 ? "NEW" : "v[2]", val: animStep > 0 ? 99 : 30, x: animStep > 0 ? 245 : 245 },
          { label: "v[3]", val: 30, x: animStep > 0 ? 330 + 30 : 330 },
          { label: "v[4]", val: 40, x: animStep > 0 ? 415 + 30 : 415 }
        ];

        discs.forEach((d) => {
          const isNew = d.label === "NEW";
          const col = isNew ? "#10b981" : "#3b82f6";
          svg += `
            <rect x="${d.x}" y="${cy-45}" width="75" height="75" rx="6" fill="${isNew?'rgba(16, 185, 129, 0.25)':'rgba(59, 130, 246, 0.12)'}" stroke="${col}" stroke-width="2"/>
            <text x="${d.x + 37.5}" y="${cy - 20}" fill="${col}" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">${d.label}</text>
            <text x="${d.x + 37.5}" y="${cy + 8}" fill="#fff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">Val: ${d.val}</text>
          `;
        });

      } else {
        svg = `
          <text x="300" y="45" fill="#10b981" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">LINKED LIST: POINTER RE-ROUTING (O(1))</text>
        `;

        if (animStep === 0) {
          svg += `
            <line x1="160" y1="${cy}" x2="240" y2="${cy}" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
            <line x1="340" y1="${cy}" x2="420" y2="${cy}" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
          `;
        } else {
          svg += `
            <line x1="160" y1="${cy}" x2="240" y2="${cy-55}" stroke="#f59e0b" stroke-width="2.5"/>
            <line x1="340" y1="${cy-55}" x2="420" y2="${cy}" stroke="#10b981" stroke-width="2.5"/>
          `;
        }

        const nodes = [
          { label: "Head", val: "10", x: 80, y: cy },
          { label: "Node 1", val: "20", x: 250, y: cy + (animStep > 0 ? -55 : 0) },
          { label: "New Node", val: "99", x: 250, y: cy + 55, show: animStep > 0 },
          { label: "Node 2", val: "30", x: 420, y: cy }
        ];

        nodes.forEach((n) => {
          if (n.label === "New Node" && !n.show) return;
          const col = n.label === "New Node" ? "#10b981" : "#3b82f6";
          svg += `
            <rect x="${n.x}" y="${n.y - 30}" width="90" height="60" rx="6" fill="rgba(13, 21, 38, 0.95)" stroke="${col}" stroke-width="2"/>
            <text x="${n.x + 45}" y="${n.y - 12}" fill="${col}" font-size="9" font-family="monospace" text-anchor="middle">${n.label}</text>
            <text x="${n.x + 45}" y="${n.y + 12}" fill="#fff" font-size="11.5" font-weight="bold" font-family="monospace" text-anchor="middle">[${n.val} | •]</text>
          `;
        });
      }

      stage.innerHTML = svg;
    }

    window.addEventListener('DOMContentLoaded', () => {
      toggleLanguage();
    });
  </script>
</body>
</html>
